    "narration": "Let's examine the snapshot fallacy through information theory and Neye-quist sampling. More samples directly yield higher resolution and superior measurement quality. When we compare a quarterly lab regimen\u2014which provides only two isolated samples at the start and end of ninety days\u2014against random sporadic fingersticks and automated continuous telemetry across the five fundamental dimensions of metrology: sensitivity, specificity, accuracy, precision, and repeatability, the mathematics is undeniable. A standard quarterly lab evaluation yields exactly two samples: one at day zero and one at day ninety. With N equal to two across seven point seven million seconds, the sampling frequency is sixty-four nanohertz, causing total Neye-quist aliasing. It is completely blind to nocturnal hypoglycemia and glycemic excursions. Random fingersticks increase N to approximately one hundred and eighty points, but remain sporadic and sub-Neye-quist. In stark contrast, LCARS delivers automated continuous sampling, recording two hundred and eighty-eight epochs per day across eight channels. Over ninety days, that yields twenty-five thousand nine hundred and twenty glucose points, and over two hundred and seven thousand total measurements. Mathematically, the standard error of the mean scales as sigma divided by the square root of N, reducing error variance by ninety-nine point four percent. Operating with a five-minute period, LCARS satisfies the Neye-quist criterion of sampling at twice the maximum biological kinetic frequency, transforming blind snapshots into clinical-grade physiological fidelity.",

    "right_html": "\n          <!-- 90-Day Sampling Timeline: Quarterly Lab vs Fingersticks vs LCARS Continuous -->\n          <div style=\"background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 10px; margin-top: 4px; color: #0f172a;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid #cbd5e1; padding-bottom: 4px; margin-bottom: 8px;\">\n              <span style=\"font-family: monospace; font-size: 0.72rem; color: #0284c7; font-weight: 800; letter-spacing: 0.05em;\">90-DAY SAMPLING RESOLUTION TIMELINE</span>\n              <span style=\"background: #0284c7; color: #fff; font-size: 0.60rem; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-family: monospace;\">MORE SAMPLES = HIGHER RESOLUTION & QUALITY</span>\n            </div>\n\n            <!-- 90-Day Timeline Graphic Bars -->\n            <div style=\"display: flex; flex-direction: column; gap: 7px; font-family: monospace; font-size: 0.68rem;\">\n              <!-- Tier 1: Quarterly Lab (N=2: Start & End of 90 Days) -->\n              <div>\n                <div style=\"display: flex; justify-content: space-between; color: #dc2626; font-weight: bold; margin-bottom: 2px;\">\n                  <span>1. QUARTERLY LAB: 2 SAMPLES (START DAY 0 & END DAY 90)</span>\n                  <span>N=2 SAMPLES / 90 DAYS (fs = 6.4\u00d710\u207b\u2078 Hz)</span>\n                </div>\n                <div style=\"position: relative; height: 18px; background: #fee2e2; border-radius: 4px; border: 1px solid #ef4444; overflow: hidden; display: flex; align-items: center;\">\n                  <!-- Day 0 Sample Point -->\n                  <div style=\"position: absolute; left: 4px; width: 12px; height: 12px; background: #dc2626; border-radius: 50%; box-shadow: 0 0 6px #ef4444;\" title=\"Start Lab Draw (Day 0)\"></div>\n                  <!-- 90-Day Blind Interval Line -->\n                  <div style=\"position: absolute; left: 20px; right: 20px; height: 2px; background: #94a3b8; border-style: dashed;\"></div>\n                  <!-- Day 90 Sample Point -->\n                  <div style=\"position: absolute; right: 4px; width: 12px; height: 12px; background: #dc2626; border-radius: 50%; box-shadow: 0 0 6px #ef4444;\" title=\"End Lab Draw (Day 90)\"></div>\n                  <span style=\"position: absolute; left: 26px; font-size: 0.58rem; color: #991b1b; font-weight: bold;\">\n                    \ud83d\udccd DAY 0 \u2500\u2500\u2500\u2500\u2500\u2500 90-DAY TOTAL BLIND VOID (7.78M SECONDS: ZERO DATA) \u2500\u2500\u2500\u2500\u2500\u2500 \ud83d\udccd DAY 90\n                  </span>\n                </div>\n              </div>\n\n              <!-- Tier 2: Conventional Fingersticks (1-4/day sporadic) -->\n              <div>\n                <div style=\"display: flex; justify-content: space-between; color: #d97706; font-weight: bold; margin-bottom: 2px;\">\n                  <span>2. RANDOM SPOT-CHECKS: SPORADIC FINGERSTICKS (N\u2248180)</span>\n                  <span>~180 POINTS / 90 DAYS (SUB-NEYE-QUIST)</span>\n                </div>\n                <div style=\"position: relative; height: 18px; background: #fef3c7; border-radius: 4px; border: 1px solid #f59e0b; overflow: hidden; display: flex; align-items: center; justify-content: space-around;\">\n                  <span style=\"color: #b45309; font-size: 0.65rem; font-weight: bold;\">\u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 &nbsp; \u2022 (SPORADIC AWAKE BIAS: NOCTURNAL BLIND)</span>\n                </div>\n              </div>\n\n              <!-- Tier 3: LCARS 5010 Continuous 288x8 Automated Telemetry -->\n              <div>\n                <div style=\"display: flex; justify-content: space-between; color: #15803d; font-weight: bold; margin-bottom: 2px;\">\n     "right_html": "\n          <!-- Error Convergence & SNR Resolution Scale -->\n          <div style=\"background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 10px; margin-top: 4px; color: #0f172a;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid #cbd5e1; padding-bottom: 4px; margin-bottom: 8px;\">\n              <span style=\"font-family: monospace; font-size: 0.72rem; color: #0284c7; font-weight: 800; letter-spacing: 0.05em;\">STATISTICAL ERROR CONVERGENCE (SE = \u03c3 / \u221aN)</span>\n              <span style=\"background: #0284c7; color: #fff; font-size: 0.60rem; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-family: monospace;\">CENTRAL LIMIT THEOREM</span>\n            </div>\n\n            <!-- Quantitative Error Reduction Bars -->\n            <div style=\"display: flex; flex-direction: column; gap: 7px; font-family: monospace; font-size: 0.68rem;\">\n              <!-- Tier 1: Quarterly Lab (N=2) -->\n              <div>\n                <div style=\"display: flex; justify-content: space-between; color: #dc2626; font-weight: bold; margin-bottom: 2px;\">\n                  <span>QUARTERLY LAB (N=2 SAMPLES): SE = 0.707 \u03c3</span>\n                  <span>UNCERTAINTY: 70.7% (MASSIVE DISPERSION)</span>\n                </div>\n                <div style=\"height: 18px; background: #fee2e2; border-radius: 3px; border: 1px solid #ef4444; position: relative; overflow: hidden; display: flex; align-items: center;\">\n                  <div style=\"width: 70.7%; height: 100%; background: #ef4444; opacity: 0.7;\"></div>\n                  <span style=\"position: absolute; left: 8px; font-size: 0.60rem; color: #ffffff; font-weight: 800;\">CI: \u00b11.38 \u03c3 (EXTREME CLINICAL UNCERTAINTY)</span>\n                </div>\n              </div>\n\n              <!-- Tier 2: Fingersticks (N=180) -->\n              <div>\n                <div style=\"display: flex; justify-content: space-between; color: #d97706; font-weight: bold; margin-bottom: 2px;\">\n                  <span>CONVENTIONAL FINGERSTICKS (N\u2248180 POINTS): SE = 0.0745 \u03c3</span>\n                  <span>UNCERTAINTY: 7.45% (MODERATE DISPERSION)</span>\n                </div>\n                <div style=\"height: 18px; background: #fef3c7; border-radius: 3px; border: 1px solid #f59e0b; position: relative; overflow: hidden; display: flex; align-items: center;\">\n                  <div style=\"width: 7.45%; height: 100%; background: #f59e0b; opacity: 0.85;\"></div>\n                  <span style=\"position: absolute; left: 8px; font-size: 0.60rem; color: #78350f; font-weight: 800;\">CI: \u00b10.15 \u03c3 (13.4\u00d7 NOISE REDUCTION)</span>\n                </div>\n              </div>\n\n              <!-- Tier 3: LCARS 5010 Continuous (N=25,920) -->\n              <div>\n                <div style=\"display: flex; justify-content: space-between; color: #15803d; font-weight: bold; margin-bottom: 2px;\">\n                  <span>LCARS 5010 GLUCOSE (N=25,920 EPOCHS): SE = 0.0062 \u03c3</span>\n                  <span>UNCERTAINTY: 0.62% (99.4% ERROR SUPPRESSION)</span>\n                </div>\n                <div style=\"height: 20px; background: #dcfce7; border-radius: 3px; border: 1.5px solid #16a34a; position: relative; overflow: hidden; display: flex; align-items: center;\">\n                  <div style=\"width: 0.62%; min-width: 4px; height: 100%; background: #16a34a;\"></div>\n                  <span style=\"position: absolute; left: 8px; font-size: 0.62rem; color: #14532d; font-weight: 800;\">CI: \u00b10.012 \u03c3 \u2022 161\u00d7 NOISE SUPPRESSION \u2022 MAXIMUM RESOLUTION</span>\n                </div>\n              </div>\n            </div>\n          </div>\n\n          <!-- Mathematical Derivation Matrix -->\n          <div style=\"margin-top: 8px; border: 1.5px solid #cbd5e1; border-radius: 6px; overflow: hidden; background: #ffffff;\">\n            <table style=\"width: 100%; border-collapse: collapse; font-size: 0.69rem; text-align: left;\">\n              <thead>\n                <tr style=\"background: #f1f5f9; color: #0f172a; border-bottom: 2px solid #cbd5e1; font-family: monospace;\">\n                  <th style=\"padding: 4px 6px;\">STATISTICAL METRIC</th>\n                  <th style=\"padding: 4px 6px; color: #dc2626;\">LAB A1C (N=2)</th>\n                  <th style=\"padding: 4px 6px; color: #d97706;\">FINGERSTICKS (N\u2248180)</th>\n                  <th style=\"padding: 4px 6px; color: #15803d; background: #f0fdf4;\">LCARS 5010 (N=25,920)</th>\n                </tr>\n              </thead>\n              <tbody>\n                <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n                  <td style=\"padding: 3px 6px; font-weight: bold; color: #334155;\">Standard Error (SE = \u03c3/\u221aN)</td>\n                  <td style=\"padding: 3px 6px; color: #dc2626; font-family: monospace;\">0.7071 \u03c3</td>\n                  <td style=\"padding: 3px 6px; color: #d97706; font-family: monospace;\">0.0745 \u03c3</td>\n                  <td style=\"padding: 3px 6px; color: #15803d; font-family: monospace; font-weight: bold; background: #f0fdf4;\">0.0062 \u03c3 (161\u00d7 Sharper)</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n                  <td style=\"padding: 3px 6px; font-weight: bold; color: #334155;\">Error Variance (Var = \u03c3\u00b2/N)</td>\n                  <td style=\"padding: 3px 6px; color: #dc2626; font-family: monospace;\">0.5000 \u03c3\u00b2</td>\n                  <td style=\"padding: 3px 6px; color: #d97706; font-family: monospace;\">0.0056 \u03c3\u00b2</td>\n                  <td style=\"padding: 3px 6px; color: #15803d; font-family: monospace; font-weight: bold; background: #f0fdf4;\">0.000038 \u03c3\u00b2 (99.4% Reduction)</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n                  <td style=\"padding: 3px 6px; font-weight: bold; color: #334155;\">95% Confidence Interval (CI)</td>\n                  <td style=\"padding: 3px 6px; color: #dc2626; font-family: monospace;\">x\u0304 \u00b1 1.385 \u03c3</td>\n                  <td style=\"padding: 3px 6px; color: #d97706; font-family: monospace;\">x\u0304 \u00b1 0.146 \u03c3</td>\n                  <td style=\"padding: 3px 6px; color: #15803d; font-family: monospace; font-weight: bold; background: #f0fdf4;\">x\u0304 \u00b1 0.012 \u03c3 (Extremely Narrow)</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #e2e8f0;\">\n                  <td style=\"padding: 3px 6px; font-weight: bold; color: #334155;\">Noise Suppression (\u221aN)</td>\n                  <td style=\"padding: 3px 6px; color: #dc2626; font-family: monospace;\">1.41\u00d7 (3.0 dB)</td>\n                  <td style=\"padding: 3px 6px; color: #d97706; font-family: monospace;\">13.4\u00d7 (22.5 dB)</td>\n                  <td style=\"padding: 3px 6px; color: #15803d; font-family: monospace; font-weight: bold; background: #f0fdf4;\">161.0\u00d7 (44.1 dB SNR Gain)</td>\n                </tr>\n                <tr>\n                  <td style=\"padding: 3px 6px; font-weight: bold; color: #334155;\">Metrological Quality Rating</td>\n                  <td style=\"padding: 3px 6px; color: #dc2626; font-weight: bold;\">Unreliable Snapshot</td>\n                  <td style=\"padding: 3px 6px; color: #d97706;\">Moderate Coarse Trend</td>\n                  <td style=\"padding: 3px 6px; color: #15803d; font-weight: 800; background: #f0fdf4;\">Clinical Telemetry Benchmark</td>\n                </tr>\n              </tbody>\n            </table>\n          </div>\n\n          <!-- Mathematical Law Callout Cards -->\n          <div style=\"margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: monospace; font-size: 0.67rem;\">\n            <div style=\"background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; padding: 6px;\">\n              <div style=\"color: #1e40af; font-weight: bold;\">\ud83d\udcca LAW OF LARGE NUMBERS (LLN)</div>\n              <div style=\"color: #1e3a8a; margin-top: 2px; line-height: 1.35;\">As N \u27f6 25,920, sample average x\u0304 converges almost surely to expected truth \u03bc: P(lim |x\u0304 - \u03bc| = 0) = 1.</div>\n            </div>\n            <div style=\"background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 4px; padding: 6px;\">\n              <div style=\"color: #166534; font-weight: bold;\">\ud83d\udd2c CENTRAL LIMIT THEOREM (CLT)</div>\n              <div style=\"color: #14532d; margin-top: 2px; line-height: 1.35;\">Sampling distribution of the mean approaches pure Gaussianity with variance \u03c3\u00b2/N, enabling rigorous hypothesis testing (p &lt; 0.0001).</div>\n            </div>\n          </div>\n    ",

ct Sensor 1 -->\n              <rect x=\"30\" y=\"62\" width=\"150\" height=\"18\" rx=\"3\" fill=\"#fed7aa\" stroke=\"#ea580c\"/>\n              <text x=\"105\" y=\"74\" fill=\"#9a3412\" font-size=\"7\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">SENSOR 1: EPIDERMAL CONTACT (T_skin: 85.6\u00b0F)</text>\n              \n              <!-- Wrist Tissue -->\n              <rect x=\"15\" y=\"90\" width=\"180\" height=\"65\" rx=\"4\" fill=\"#fee2e2\"/>\n              <text x=\"105\" y=\"105\" fill=\"#991b1b\" font-size=\"7.5\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">DEEP ARTERIAL CORE PERFUSION</text>\n              <text x=\"105\" y=\"125\" fill=\"#dc2626\" font-size=\"13\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"900\">T_core = 96.1\u00b0F</text>\n              <text x=\"105\" y=\"145\" fill=\"#7f1d1d\" font-size=\"6.5\" font-family=\"monospace\" text-anchor=\"middle\">Heat-Flux Model: Tcore = Tskin + \u03b1(Tskin - Tint)</text>\n\n              <!-- Right: 24-Hour Circadian Temperature Curve (x: 210 to 410) -->\n              <rect x=\"210\" y=\"10\" width=\"195\" height=\"145\" rx=\"5\" fill=\"#ffffff\" stroke=\"#cbd5e1\"/>\n              <text x=\"307\" y=\"24\" fill=\"#0284c7\" font-size=\"8\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">24-HOUR CIRCADIAN THERMAL CYCLE</text>\n\n              <!-- Grid Lines -->\n              <line x1=\"230\" y1=\"40\" x2=\"395\" y2=\"40\" stroke=\"#f1f5f9\" stroke-width=\"1\"/>\n              <line x1=\"230\" y1=\"75\" x2=\"395\" y2=\"75\" stroke=\"#f1f5f9\" stroke-width=\"1\"/>\n              <line x1=\"230\" y1=\"110\" x2=\"395\" y2=\"110\" stroke=\"#f1f5f9\" stroke-width=\"1\"/>\n\n              <!-- Y-Axis Labels -->\n              <text x=\"225\" y=\"43\" fill=\"#64748b\" font-size=\"6.5\" font-family=\"monospace\" text-anchor=\"end\">98.6\u00b0</text>\n              <text x=\"225\" y=\"78\" fill=\"#64748b\" font-size=\"6.5\" font-family=\"monospace\" text-anchor=\"end\">97.2\u00b0</text>\n              <text x=\"225\" y=\"113\" fill=\"#64748b\" font-size=\"6.5\" font-family=\"monospace\" text-anchor=\"end\">95.8\u00b0</text>\n\n              <!-- Circadian Curve (Dips deeply at 4:30 AM Nadir, rises afternoon) -->\n              <path d=\"M 235 60 C 260 70, 275 118, 295 118 C 320 118, 345 45, 385 45\" fill=\"none\" stroke=\"#0284c7\" stroke-width=\"2.5\"/>\n\n              <!-- Circadian Nadir Marker -->\n              <circle cx=\"295\" cy=\"118\" r=\"4\" fill=\"#dc2626\"/>\n              <text x=\"295\" y=\"132\" fill=\"#dc2626\" font-size=\"7\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">4:30 AM NADIR: 96.0\u00b0F</text>\n\n              <!-- Time Labels -->\n              <text x=\"235\" y=\"150\" fill=\"#64748b\" font-size=\"6\" font-family=\"monospace\">00:00</text>\n              <text x=\"295\" y=\"150\" fill=\"#dc2626\" font-size=\"6\" font-family=\"monospace\" font-weight=\"bold\">04:30</text>\n              <text x=\"350\" y=\"150\" fill=\"#64748b\" font-size=\"6\" font-family=\"monospace\">12:00</text>\n              <text x=\"390\" y=\"150\" fill=\"#64748b\" font-size=\"6\" font-family=\"monospace\">20:00</text>\n            </svg>\n\n            <!-- Physiological Significance Callout -->\n            <div style=\"margin-top: 6px; background: #eff6ff; border-left: 4px solid #0284c7; padding: 5px 8px; border-radius: 4px; font-size: 0.67rem; color: #1e3a8a; line-height: 1.35; font-family: monospace;\">\n              <strong>CIRCADIAN NADIR BIOMARKER:</strong> Deep nighttime cooling to ~96.0\u00b0F reflects healthy parasympathetic tone and metabolic rest. Blunted or absent nocturnal dipping signals chronic systemic inflammation and nocturnal stress.\n            </div>\n          </div>\n",

    "takeaway": "Continuous cuffless blood pressure monitoring that captures 24-hour cardiovascular dipping.",

5\" stroke-dasharray=\"3,2\"/>\n\n              <!-- PWTT Delta Time Arrow -->\n              <line x1=\"95\" y1=\"65\" x2=\"210\" y2=\"65\" stroke=\"#d97706\" stroke-width=\"2\"/>\n              <rect x=\"120\" y=\"56\" width=\"65\" height=\"16\" fill=\"#fef3c7\" rx=\"3\" stroke=\"#f59e0b\"/>\n              <text x=\"152\" y=\"68\" fill=\"#b45309\" font-size=\"7\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">PWTT = 215 ms</text>\n\n              <!-- Signal 2: Peripheral Wrist Optical PPG (Arterial Pulse Arrival) -->\n              <text x=\"20\" y=\"85\" fill=\"#15803d\" font-size=\"8\" font-family=\"monospace\" font-weight=\"bold\">2. WRIST OPTICAL PPG (PULSE ARRIVAL & DICROTIC NOTCH: t\u2081)</text>\n              <path d=\"M 20 120 L 170 120 C 185 120, 195 78, 210 78 C 225 78, 235 98, 245 94 C 255 90, 270 120, 310 120 L 400 120\" fill=\"none\" stroke=\"#15803d\" stroke-width=\"2.5\"/>\n              <circle cx=\"210\" cy=\"78\" r=\"3\" fill=\"#15803d\"/>\n              <text x=\"210\" y=\"72\" fill=\"#15803d\" font-size=\"7\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">SYSTOLIC PEAK</text>\n              <circle cx=\"245\" cy=\"94\" r=\"2.5\" fill=\"#d97706\"/>\n              <text x=\"245\" y=\"88\" fill=\"#d97706\" font-size=\"6.5\" font-family=\"monospace\" text-anchor=\"middle\">DICROTIC NOTCH</text>\n\n              <!-- PWV & BP Readout Card -->\n              <rect x=\"290\" y=\"130\" width=\"120\" height=\"32\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n              <text x=\"350\" y=\"142\" fill=\"#334155\" font-size=\"7\" font-family=\"monospace\" text-anchor=\"middle\">CALCULATED BP</text>\n              <text x=\"350\" y=\"157\" fill=\"#dc2626\" font-size=\"11\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">126 / 84 MMHG</text>\n            </svg>\n\n            <!-- Physical Law Callout -->\n            <div style=\"margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: monospace; font-size: 0.67rem;\">\n              <div style=\"background: #fffbeb; border: 1px solid #fde68a; border-radius: 4px; padding: 5px;\">\n                <div style=\"color: #92400e; font-weight: bold;\">\ud83d\udcd0 MOENS-KORTEWEG PHYSICAL LAW</div>\n                <div style=\"color: #78350f; margin-top: 2px;\">PWV = Distance / PWTT = \u221a(E\u00b7h / 2r\u03c1)<br>Stiffened hypertensive arteries accelerate pulse wave arrival.</div>\n              </div>\n              <div style=\"background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 4px; padding: 5px;\">\n                <div style=\"color: #166534; font-weight: bold;\">\ud83c\udf19 NOCTURNAL DIPPING CRITERION</div>\n                <div style=\"color: #14532d; margin-top: 2px;\">Verifies healthy 10%\u201320% overnight blood pressure dip without disturbing sleep with an inflating cuff.</div>\n              </div>\n            </div>\n          </div>\n",

    "right_html": "\n          <!-- Autonomic HRV Poincar\u00e9 Scatter & Sympatho-Vagal Balance -->\n          <div style=\"background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 10px; margin-top: 4px; color: #0f172a;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid #cbd5e1; padding-bottom: 4px; margin-bottom: 6px;\">\n              <span style=\"font-family: monospace; font-size: 0.72rem; color: #0284c7; font-weight: 800;\">AUTONOMIC HRV POINCAR\u00c9 SCATTER & VAGAL TONE</span>\n              <span style=\"background: #4f46e5; color: #fff; font-size: 0.60rem; font-weight: bold; padding: 2px 6px; border-radius: 3px; font-family: monospace;\">SD1 vs SD2 DYNAMICS</span>\n            </div>\n\n            <!-- SVG Diagram: R-R Tachogram & Poincar\u00e9 Scatter Geometry -->\n            <svg viewBox=\"0 0 420 170\" style=\"width: 100%; height: auto; display: block; background: #ffffff; border-radius: 4px; border: 1px solid #e2e8f0;\">\n              <!-- Left: R-R Interval Tachogram (x: 10 to 180) -->\n              <rect x=\"15\" y=\"10\" width=\"175\" height=\"145\" rx=\"5\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n              <text x=\"102\" y=\"24\" fill=\"#334155\" font-size=\"8\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">R-R INTERVAL VARIABILITY (IBI)</text>\n\n              <!-- Heartbeat sequence showing millisecond variations -->\n              <path d=\"M 25 90 L 40 70 L 55 95 L 70 65 L 85 88 L 100 68 L 115 92 L 130 72 L 145 85 L 160 65 L 175 88\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"1.8\"/>\n              <circle cx=\"40\" cy=\"70\" r=\"2.5\" fill=\"#4f46e5\"/>\n              <circle cx=\"70\" cy=\"65\" r=\"2.5\" fill=\"#4f46e5\"/>\n              <circle cx=\"100\" cy=\"68\" r=\"2.5\" fill=\"#4f46e5\"/>\n              \n              <text x=\"102\" y=\"120\" fill=\"#312e81\" font-size=\"7\" font-family=\"monospace\" text-anchor=\"middle\">RR\u2081=840ms \u2022 RR\u2082=790ms \u2022 RR\u2083=860ms</text>\n              <text x=\"102\" y=\"140\" fill=\"#15803d\" font-size=\"7.5\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">HEALTHY HRV: SDNN = 64 MS</text>\n\n              <!-- Right: Poincar\u00e9 / Lorenz Scatter Plot (x: 205 to 410) -->\n              <rect x=\"205\" y=\"10\" width=\"200\" height=\"145\" rx=\"5\" fill=\"#ffffff\" stroke=\"#cbd5e1\"/>\n              <text x=\"305\" y=\"24\" fill=\"#4f46e5\" font-size=\"8\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">POINCAR\u00c9 (LORENZ) SCATTER PLOT</text>\n\n              <!-- Line of Identity (RR_n+1 = RR_n) -->\n              <line x1=\"225\" y1=\"135\" x2=\"385\" y2=\"35\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n              <text x=\"385\" y=\"30\" fill=\"#94a3b8\" font-size=\"6\" font-family=\"monospace\">RR(n+1)=RR(n)</text>\n\n              <!-- Healthy Comet Ellipse -->\n              <ellipse cx=\"305\" cy=\"85\" rx=\"45\" ry=\"22\" transform=\"rotate(-45 305 85)\" fill=\"#e0e7ff\" opacity=\"0.6\" stroke=\"#6366f1\" stroke-width=\"1.5\"/>\n\n              <!-- Scatter Points -->\n              <circle cx=\"300\" cy=\"80\" r=\"2\" fill=\"#4338ca\"/>\n              <circle cx=\"310\" cy=\"90\" r=\"2\" fill=\"#4338ca\"/>\n              <circle cx=\"285\" cy=\"100\" r=\"2\" fill=\"#4338ca\"/>\n              <circle cx=\"325\" cy=\"70\" r=\"2\" fill=\"#4338ca\"/>\n              <circle cx=\"295\" cy=\"95\" r=\"2\" fill=\"#4338ca\"/>\n              <circle cx=\"320\" cy=\"75\" r=\"2\" fill=\"#4338ca\"/>\n              <circle cx=\"340\" cy=\"55\" r=\"2\" fill=\"#4338ca\"/>\n              <circle cx=\"270\" cy=\"115\" r=\"2\" fill=\"#4338ca\"/>\n\n              <!-- SD1 & SD2 Vector Axes -->\n              <line x1=\"290\" y1=\"100\" x2=\"320\" y2=\"70\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n              <text x=\"330\" y=\"65\" fill=\"#15803d\" font-size=\"6.5\" font-family=\"monospace\" font-weight=\"bold\">SD1 (Vagal Tone)</text>\n\n              <line x1=\"275\" y1=\"115\" x2=\"335\" y2=\"55\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n              <text x=\"250\" y=\"130\" fill=\"#991b1b\" font-size=\"6.5\" font-family=\"monospace\" font-weight=\"bold\">SD2 (Sympathetic)</text>\n\n              <text x=\"305\" y=\"150\" fill=\"#4338ca\" font-size=\"6.5\" font-family=\"monospace\" text-anchor=\"middle\" font-weight=\"bold\">ELLIPSE RATIO (SD1/SD2) = AUTONOMIC BALANCE</text>\n            </svg>\n\n            <!-- Autonomic Health Significance -->\n            <div style=\"margin-top: 6px; background: #eef2ff; border-left: 4px solid #4f46e5; padding: 5px 8px; border-radius: 4px; font-size: 0.67rem; color: #312e81; line-height: 1.35; font-family: monospace;\">\n              <strong>VAGAL BRAKE ON GLYCEMIA:</strong> Robust parasympathetic tone (wide SD1 ellipse) buffers against stress-induced hepatic glycogenolysis. Narrowing to a torpedo cluster warns of sympathetic overdrive, cortisol surges, and diabetic neuropathy.\n            </div>\n          </div>\n",

    function loadSlide(index) {
      if (index < 0) index = 0;

      const s = slides[currentIndex];
      document.getElementById('slideIframe').src = `slides/slide_${s.num}.html`;

      document.getElementById('lblTranscriptTitle').innerText = `SLIDE ${s.num}: ${s.title}`;
      document.getElementById('txtTranscript').innerText = s.narration;

      // Position IMMEDIATELY on transition to the specific initial screen area!
      const initialPct = (s.step_focus && s.step_focus.length > 0) ? s.step_focus[0].scroll_pct : 0.0;
      currentScrollLeft = initialPct * 1000;
      targetScrollLeft = initialPct * 1000;
      currentScrollRight = 0;
      targetScrollRight = 0;

      try {
        const iframe = document.getElementById('slideIframe');
        iframe.onload = () => {
          const doc = iframe.contentDocument;
          if (doc) {
            doc.addEventListener('keydown', handleGlobalKeyDown);
            const leftViewport = doc.querySelector('.left-screenshot-viewport');
            if (leftViewport) {
              const maxLeftScroll = leftViewport.scrollHeight - leftViewport.clientHeight;
              const initPos = (maxLeftScroll > 0) ? initialPct * maxLeftScroll : 0;
              leftViewport.scrollTop = initPos;
              currentScrollLeft = initPos;
              targetScrollLeft = initPos;
            }
          }
          currentScrollRight = 0;
          targetScrollRight = 0;
          syncSlideContent(0.0);
        };
        if (iframe && iframe.contentDocument) {
          iframe.contentDocument.addEventListener('keydown', handleGlobalKeyDown);
          const leftViewport = iframe.contentDocument.querySelector('.left-screenshot-viewport');
          if (leftViewport) {
            const maxLeftScroll = leftViewport.scrollHeight - leftViewport.clientHeight;
            const initPos = (maxLeftScroll > 0) ? initialPct * maxLeftScroll : 0;
            leftViewport.scrollTop = initPos;
            currentScrollLeft = initPos;
            targetScrollLeft = initPos;
          }
          currentScrollRight = 0;
          targetScrollRight = 0;
          syncSlideContent(0.0);
        }

    let currentScrollLeft = 0;

    function renderSmoothLoop() {
      const audioEl = document.getElementById('audioPlayer');
      if (isPlaying && audioEl && audioEl.duration > 0 && !audioEl.paused) {
        const norm = audioEl.currentTime / audioEl.duration;
        syncSlideContent(norm);

      try {

          const leftViewport = iframe.contentDocument.querySelector('.left-screenshot-viewport');
          if (leftViewport && leftViewport.scrollHeight > leftViewport.clientHeight) {
            // Smooth 60fps linear interpolation: glides 8% of distance each frame
            currentScrollLeft += (targetScrollLeft - currentScrollLeft) * 0.08;
            leftViewport.scrollTop = currentScrollLeft;
          }
          const rightCard = iframe.contentDocument.querySelector('.visual-card');
          if (rightCard && rightCard.scrollHeight > rightCard.clientHeight) {
            currentScrollRight += (targetScrollRight - currentScrollRight) * 0.08;
            rightCard.scrollTop = currentScrollRight;
          }
        }
      } catch(e) {}

      animLoopId = requestAnimationFrame(renderSmoothLoop);

    function syncSlideContent(norm) {

        bullets.forEach((b, idx) => {
          if (idx === activeIdx) {
            b.style.background = '#e0f2fe';
            b.style.borderLeft = '4px solid #0284c7';
            b.style.color = '#0369a1';
            b.style.fontWeight = '700';
            b.style.paddingLeft = '10px';
          } else {
            b.style.background = 'transparent';
            b.style.borderLeft = '4px solid transparent';
            b.style.color = '#1e293b';
            b.style.fontWeight = 'normal';
            b.style.paddingLeft = '8px';
          }
        });

        // Dynamic Zone Badge Header
        if (zoneBadge) {
          if (s.bullets && s.bullets[activeIdx]) {
            const bTitle = s.bullets[activeIdx][0].toUpperCase();
            zoneBadge.innerText = `📍 FOCUS: ${bTitle.length > 28 ? bTitle.substring(0, 26) + '...' : bTitle}`;
          } else {
            zoneBadge.innerText = `📍 FOCUS: SECTION ${activeIdx + 1}`;
          }
          if (activeIdx === 0) zoneBadge.style.background = '#0284c7';
          else if (activeIdx === 1) zoneBadge.style.background = '#0369a1';
          else zoneBadge.style.background = '#0f766e';
        }

        // Monotonic Top-to-Bottom Smooth Target: glides steadily without jumping up and down
        // Plateau Scroll & Pause Timing Engine:
        // Holds 100% steady during the topic talk, glides monotonically between topics, never jumps up
        if (leftViewport && leftViewport.scrollHeight > leftViewport.clientHeight) {
          const maxLeftScroll = leftViewport.scrollHeight - leftViewport.clientHeight;
          if (maxLeftScroll > 0) {
            const focusPoints = (s.step_focus && s.step_focus.length > 0) 
              ? s.step_focus 
              : [{scroll_pct: 0.0}, {scroll_pct: 0.40}, {scroll_pct: 0.85}];
            
            const n = focusPoints.length;
            let targetPct = focusPoints[0].scroll_pct;
            
            for (let i = 0; i < n; i++) {
              const segStart = i / n;
              const segEnd = (i + 1) / n;
              // Hold/Pause steady during 75% of this topic duration!
              const pauseUntil = segStart + (segEnd - segStart) * 0.75;
              
              if (norm < pauseUntil) {
                targetPct = focusPoints[i].scroll_pct;
                break;
              } else if (norm < segEnd) {
                if (i < n - 1) {
                  const t = (norm - pauseUntil) / (segEnd - pauseUntil);
                  const ease = 0.5 - 0.5 * Math.cos(t * Math.PI);
                  targetPct = focusPoints[i].scroll_pct + (focusPoints[i+1].scroll_pct - focusPoints[i].scroll_pct) * ease;
                } else {
                  targetPct = focusPoints[i].scroll_pct;
                }
                break;
              } else {
                targetPct = focusPoints[i].scroll_pct;
              }
            }
            targetScrollLeft = targetPct * maxLeftScroll;
          }
        }

        if (rightCard && rightCard.scrollHeight > rightCard.clientHeight) {
          const maxScroll = rightCard.scrollHeight - rightCard.clientHeight;
          targetScrollRight = norm * maxScroll;
        }
      } catch(e) {}
    }

    function speakNarration(text) {
      if (synth) synth.cancel();
      clearTimeout(slideTimer);

      if (!isPlaying) return;

      const s = slides[currentIndex];
      const audioEl = document.getElementById('audioPlayer');
      audioEl.src = `audio/slide_${s.num}.mp3`;
      audioEl.playbackRate = playbackSpeed;
      audioEl.volume = 1.0;
      audioEl.muted = false;

      const p = audioEl.play();
      if (p !== undefined) {
        p.then(() => {
          audioEl.onended = () => {
            if (isPlaying) nextSlide();
          };
        }).catch((err) => {
          console.warn("Audio play error:", err);
        });
      }
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      updatePlayPauseUI();
      if (isPlaying) {
        const s = slides[currentIndex];
        speakNarration(s.narration);
      } else {
        if (synth) synth.cancel();
        const audioEl = document.getElementById('audioPlayer');
        if (audioEl) audioEl.pause();
        clearTimeout(slideTimer);
      }
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        loadSlide(currentIndex + 1);
        if (isPlaying) {
          const s = slides[currentIndex];
          speakNarration(s.narration);
        }
      } else {
        isPlaying = false;
        updatePlayPauseUI();
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        loadSlide(currentIndex - 1);
        if (isPlaying) {
          const s = slides[currentIndex];
          speakNarration(s.narration);
        }
      }
    }

    function jumpToSlide(idx) {
      loadSlide(idx);
      if (isPlaying) {
        const s = slides[currentIndex];
        speakNarration(s.narration);
      }
    }

    function toggleTranscript() {
      const d = document.getElementById('transcriptDrawer');
      const btn = document.getElementById('btnToggleTranscript');
      if (d.style.display === 'block') {
        d.style.display = 'none';
        btn.classList.remove('active');
      } else {
        d.style.display = 'block';
        btn.classList.add('active');
      }
    }

    function cycleSpeed() {
      const speeds = [1.0, 1.25, 1.5, 0.8];
      let curIdx = speeds.indexOf(playbackSpeed);
      playbackSpeed = speeds[(curIdx + 1) % speeds.length];
      document.getElementById('btnSpeed').innerText = `${playbackSpeed}x`;
      if (isPlaying) {
        const s = slides[currentIndex];
        speakNarration(s.narration);
      }
    }

    function onScrub(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const targetIdx = Math.floor(pct * slides.length);
      loadSlide(targetIdx);
      if (isPlaying) {
        const s = slides[currentIndex];
        speakNarration(s.narration);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function handleGlobalKeyDown(e) {
      if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'ArrowRight' || e.key === 'ArrowRight') {
        nextSlide();
      } else if (e.code === 'ArrowLeft' || e.key === 'ArrowLeft') {
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    }

    window.addEventListener('keydown', handleGlobalKeyDown);

    // Start on Slide 1 in RUN standby state, start render loop
    window.onload = () => {
      loadSlide(0);
      updatePlayPauseUI();
      renderSmoothLoop();
    };
  </script>
</body>
